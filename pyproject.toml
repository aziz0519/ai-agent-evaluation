[project]
name = "ai-agent-evaluation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "deepeval[inspect]>=4.3.1",
    "dotenv>=0.9.9",
    "langchain>=1.4.6",
    "langchain-openai>=1.7.2",
    "portalocker[win32]>=4.4.1",
    "streamlit>=1.50.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

# Baseline existing rule/file pairs; other Ruff findings remain blocking.
[tool.ruff.lint.per-file-ignores]
"agent/agent.py" = ["I001"]
"agent/objects.py" = ["I001"]
"agent/tools.py" = ["I001", "LOG015"]
"evaluations/answer_correctness.py" = ["I001"]
"evaluations/argument_correctness.py" = ["I001"]
"evaluations/eval_all.py" = ["I001", "UP017", "ISC004"]
"evaluations/plan_adherence.py" = ["I001"]
"evaluations/plan_quality.py" = ["I001"]
"evaluations/step_efficiency.py" = ["I001"]
"evaluations/streamlit_ui.py" = ["TRY004"]
"evaluations/task_completion.py" = ["I001"]
"evaluations/tool_correctness.py" = ["I001"]

[tool.pytest.ini_options]
testpaths = ["tests", "evaluations"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--cov=evaluations --cov=agent --cov-report=term-missing"
markers = [
    "integration: tests that require live API keys and external services"
]
